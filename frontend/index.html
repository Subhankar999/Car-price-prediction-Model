    <div class="gauge-wrap">
      <svg id="gauge" viewBox="0 0 240 150" aria-hidden="true">
        <path class="gauge-track" d="M 20 130 A 100 100 0 0 1 220 130" />
        <path class="gauge-fill" id="gaugeFill" d="M 20 130 A 100 100 0 0 1 220 130" />
        <g class="ticks">

          <line x1="194.3" y1="55.7" x2="187.4" y2="61.4"></line>
          <line x1="220" y1="130" x2="210" y2="130"></line>
        </g>
        <line id="needle" class="needle" x1="120" y1="130" x2="120" y2="45"></line>
        <circle cx="120" cy="130" r="7" class="hub"></circle>
      </svg>

        <span class="readout-label" id="readoutLabel">Estimated value</span>
        <span class="readout-value" id="readoutValue">&#8377;&nbsp;&mdash;</span>
      </div>
    </div>

      </div>
      <div class="field-grid">
        <div class="field">
          <label for="year_of_registration">Year registered</label>
          <input type="number" id="year_of_registration" placeholder="2018" required>
        </div>
        <div class="field">
          <label for="kilometer">Kilometers driven</label>
          <input type="number" id="kilometer" placeholder="50000" required>
        </div>
        <div class="field">
          <label for="power_ps">Power (PS)</label>
          <input type="number" id="power_ps" placeholder="120" required>
        </div>
        <div class="field">
          <label for="gearbox">Gearbox</label>
          <select id="gearbox" required>
            <option value="manuell">Manual</option>
            <option value="automatik">Automatic</option>
          </select>
        </div>
        <div class="field">
          <label for="fuel_type">Fuel type</label>
          <select id="fuel_type" name="fuel_type" required>
                    <option value="">Select Fuel Type</option>
                    <option value="benzin">benzin</option>
                    <option value="diesel">diesel</option>
                    <option value="lpg">lpg</option>
                    <option value="andere">andere</option>
                    <option value="hybrid">hybrid</option>
                    <option value="cng">cng</option>
                    <option value="elektro">elektro</option>

        </div>
        <div class="field">
          <label for="not_repaired_damage">Unrepaired damage</label>
          <select id="not_repaired_damage" required>
            <option value="nein">No</option>
            <option value="ja">Yes</option>
          </select>
        </div>
      </div>
    </section>

          <select id="seller" required>

            <option value="gewerblich">Dealer</option>
            <option value="other">Other</option>
